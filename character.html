<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PERSONNEL ARCHIVE | BILBAO</title>

    <link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./character.css?v=2">

    <script src="./character.js" defer></script>
</head>

<body class="archive-page">

    <!-- 상단 메뉴 -->
    <header class="archive-header">
        <a href="./index.html" class="archive-logo">BILBAO.</a>

        <a href="./index.html#character" class="archive-back">
            ← BACK TO HOME
        </a>
    </header>

    <main class="archive-main">

        <!-- 페이지 제목 -->
        <div class="archive-heading">
            <p>CLASSIFIED / PERSONNEL RECORDS</p>
            <h1>PERSONNEL ARCHIVE</h1>
            <span>인물 기록 보관소</span>
        </div>

        <!-- 타공판 -->
       <!-- 타공판 -->
<section class="pegboard" aria-label="캐릭터 명찰 보관소">

    <!-- 레볼리 -->
    <button class="hanging-card" type="button" data-character="revoli" aria-label="레볼리 프로필 확인">
        <span class="card-hook"></span>
        <img src="./images/characters/1.jpg" alt="레볼리 명찰">
    </button>

    <!-- 빌바오 -->
    <button class="hanging-card" type="button" data-character="bilbao" aria-label="빌바오 프로필 확인">
        <span class="card-hook"></span>
        <img src="./images/characters/0.jpg" alt="빌바오 명찰">
    </button>

    <!-- 리베 -->
    <button class="hanging-card" type="button" data-character="ribe" aria-label="리베 프로필 확인">
        <span class="card-hook"></span>
        <img src="./images/characters/2.jpg" alt="리베 명찰">
    </button>

    <!-- 케이지 -->
    <button class="hanging-card" type="button" data-character="keiji" aria-label="케이지 프로필 확인">
        <span class="card-hook"></span>
        <img src="./images/characters/3.jpg" alt="케이지 명찰">
    </button>

    <!-- 미나 -->
    <button class="hanging-card" type="button" data-character="mina" aria-label="미나 프로필 확인">
        <span class="card-hook"></span>
        <img src="./images/characters/4.jpg" alt="미나 명찰">
    </button>

</section>

        <p class="archive-instruction">
            SELECT AN ID CARD TO ACCESS PERSONNEL RECORDS
        </p>

    </main>

    <!-- 캐릭터 기록부 팝업 -->
    <div class="archive-overlay" id="archive-overlay" hidden>

        <section class="archive-document"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="archive-record-name">

            <button class="archive-close"
                    type="button"
                    aria-label="기록부 닫기">
                ✕
            </button>

           <div class="archive-document-photo">
    <img
        id="archive-record-image"
        src="./images/characters/portraits/01.png"
        alt="캐릭터 얼굴 이미지"
    >
</div>

            <div class="archive-document-info">

                <p>PERSONNEL RECORD / BILBAO</p>

                <h2 id="archive-record-name">REVOLI</h2>
                <h3 id="archive-record-korean">레볼리</h3>

                <div class="archive-document-line"></div>

                <p id="archive-record-description">
                    캐릭터 정보가 표시됩니다.
                </p>

            </div>

        </section>

    </div>

</body>
</html>
