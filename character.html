    <div class="archive-overlay" id="archive-overlay" hidden>

        <section class="archive-document"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="archive-record-name">

            <button class="archive-close"
                    type="button"
                    aria-label="기록부 닫기">
                ✕
            </button>

<div class="archive-document-photo">

</div>

            <div class="archive-document-info">

                <p>PERSONNEL RECORD / BILBAO</p>

<!-- 캐릭터 상세 정보 -->
